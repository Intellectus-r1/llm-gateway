spring.application.name=llm-gateway-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:9000/llm_gateway
spring.datasource.username=llm_user
spring.datasource.password=llm_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=llm-gateway-development-secret-key-change-this-later
jwt.expiration=86400000

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.default-model=gemini-3.1-flash-lite

#Openai
#openai.api-key=${OPENAI_API_KEY}
#openai.base-url=https://api.openai.com
#openai.default-model=gpt-5.4-mini

#nvidia
nvidia.api-key=${NVIDIA_API_KEY}
nvidia.base-url=https://integrate.api.nvidia.com
#nvidia.default-model=nvidia/nemotron-3-ultra-550b-a55b
nvidia.default-model=nvidia/nemotron-3-super-120b-a12b