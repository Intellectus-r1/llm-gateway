spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-key-for-jwt-testing-at-least-32-bytes
jwt.expiration=86400000

gemini.api-key=test-key
nvidia.api-key=test-key

gemini.base-url=https://generativelanguage.googleapis.com
nvidia.base-url=https://integrate.api.nvidia.com

gemini.default-model=gemini-3.1-flash-lite
nvidia.default-model=nvidia/nemotron-3-super-120b-a12b